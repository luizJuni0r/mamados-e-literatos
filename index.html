<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mamados e Literatos</title>
	<link rel="stylesheet" href="style.css">
</head>
<body class="autenticando">

	<header>
		<h1>Mamados&Literatos</h1>
	</header>

	<main class="app">

		<!-- Parte do livro que está sendo lido no momento -->
		<section class="em-leitura">
			<h2>EM LEITURA</h2>

			<article>
				<h3>As Ondas</h3>
				<p class="autor">Virginia Woolf</p>
				<p class="recomendacao">Recomendado por Luiz Junior</p>
			</article>
		</section>

		<!-- Parte que vc insere o livro que quer aplicar na votação -->
		<section class="form-recomendacao">
			<h2>Sua Recomendação</h2>

			<form id="form-formulario-recomendacao">
				<label for="nome-livro">Nome do Livro</label>
				<input type="text" id="nome-livro" name="nome-livro">

				<label for="nome-autor">Nome do Autor</label>
				<input type="text" id="nome-autor" name="nome-autor">

				<label for="observacoes">Observacoes</label>
				<textarea type="text" id="observacoes" name="observacoes"></textarea>

				<button type="submit">Recomendar</button>
			</form>

		</section>

		<!-- Parte dos livros que foram lidos -->
		<section class="historico">
			<h2>Histórico de Leitura</h2>
			<table>
				<colgroup>
			        <col class="col-livro">
			        <col class="col-autor">
			        <col class="col-recomendacao">
			    </colgroup>
				<thead>
					<tr>
						<th>Livro</th>
						<th>Autor</th>
						<th>Recomendação</th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td>Livro1</td>
						<td>Autor1</td>
						<td>Usuário1</td>
					</tr>
					<tr>
						<td>Livro2</td>
						<td>Autor2</td>
						<td>Usuário2</td>
					</tr>
					<tr>
						<td>Livro3</td>
						<td>Autor3</td>
						<td>Usuário3</td>
					</tr>
				</tbody>
				
			</table>
		</section>

	</main>

	<footer>
		<a href="https://drive.google.com/drive/folders/1VuzVpt0OhBHss8EiBRnOS0PqotA4nwRO?usp=drive_link" target="_blank">NeoAlexandria</a>
	</footer>
	

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script type="module" src="js/app.js"></script>
</body>
</html>
