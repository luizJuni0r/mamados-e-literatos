<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mamados e Literatos</title>
	<link rel="stylesheet" href="style.css">
</head>
<body class="autenticando">

	<header>
		<h1>Mamados&Literatos</h1>
		<button id="sair">Sair</button>
	</header>

	<main class="app">


		<!-- Parte do livro que está sendo lido no momento -->
		<section class="em-leitura">
			<h2 id="titulo-leitura">EM LEITURA</h2>

			<article>
			    <h3 id="leitura-livro">As Ondas</h3>
			    <p class="autor" id="leitura-autor">Virginia Woolf</p>
			    <p class="recomendado" id="leitura-recomendado">
			        Recomendado por Luiz Junior
			    </p>
			</article>
			<div class="acoes-leitura">
			    <button class="acao-admin" id="concluir-leitura">
			        Concluir
			    </button>

			    <button class="acao-admin" id="dropar-leitura">
			        Dropar
			    </button>

			    <button class="acao-admin" id="abrir-recomendacoes">
				    Abrir novas recomendações
				</button>
			</div>
		</section>


		<!-- Parte que vc insere o livro que quer aplicar na votação -->
		<section class="form-recomendacao">
			<h2>Sua Recomendação</h2>

			<form id="form-formulario-recomendacao">
				<label for="nome-livro">Nome do Livro</label>
				<input type="text" id="nome-livro" name="nome-livro" required>

				<label for="nome-autor">Nome do Autor</label>
				<input type="text" id="nome-autor" name="nome-autor" required>

				<label for="observacoes">Observacoes</label>
				<textarea type="text" id="observacoes" name="observacoes"></textarea>

				<button type="submit">Recomendar</button>
			</form>

			<p id="recomendacao-enviada">
			    Sua recomendação já foi enviada.
			</p>

			<button class="acao-admin" id="encerrar-recomendacoes">
			    Encerrar e sortear
			</button>
		</section>



		<section class="resultado-sorteio">
		    <h2>LIVRO SORTEADO</h2>

		    <article>
		        <h3 id="sorteio-livro">As Ondas</h3>
		        <p class="autor" id="sorteio-autor">Virginia Woolf</p>
		        <p class="recomendado" id="sorteio-recomendado">
		            Recomendado por Juniola
		        </p>

		        <p class="observacao" id="sorteio-observacao">
		            Observação fake.
		        </p>
		    </article>

		    <button class="acao-admin" id="iniciar-leitura">
		        Iniciar leitura
		    </button>
		</section>


		<!-- Parte dos livros que foram lidos -->
		<section class="historico">
			<h2>Histórico de Leitura</h2>
			<table>
				<colgroup>
				    <col class="col-livro">
				    <col class="col-autor">
				    <col class="col-recomendacao">
				    <col class="col-status">
				</colgroup>
			    <thead>
			        <tr>
			            <th>Livro</th>
			            <th>Autor</th>
			            <th>Recomendado por</th>
			            <th>Status</th>
			        </tr>
			    </thead>

			    <tbody id="historico-lista">
			    </tbody>
			</table>
		</section>

	</main>

	<footer>
		<a href="https://drive.google.com/drive/folders/1VuzVpt0OhBHss8EiBRnOS0PqotA4nwRO?usp=drive_link" target="_blank">NeoAlexandria Link</a>
	</footer>
	

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script type="module" src="js/app.js"></script>
</body>
</html>
